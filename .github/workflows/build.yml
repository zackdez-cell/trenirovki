name: Сборка APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Собрать
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Переименовать
        run: cp app/build/outputs/apk/release/app-release.apk Trenirovki.apk

      - name: Опубликовать релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Тренировки, сборка ${{ github.run_number }}
          body: Скачайте Trenirovki.apk и установите на планшет.
          files: Trenirovki.apk
          make_latest: true
